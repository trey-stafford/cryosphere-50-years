[project]
name = "cryosphere-50-years"
version = "0.1.0"
description = "Plot/visualize 50 years of Cryosphere data (1976 - 2026) in honor of NSIDC's 50th anniversary"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.17.1",
]
